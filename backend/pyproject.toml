[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing the app on purpose.
"tests/conftest.py" = ["E402"]
